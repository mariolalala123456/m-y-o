name: Dockur Windows qua Ngrok RDP

on: 
  workflow_dispatch # Bấm nút chạy thủ công

jobs:
  run-vm:
    runs-on: windows-latest
    steps:
    - name: 1. Tai va Chay Dockur Windows ngam
      run: |
        docker run -d -p 3389:3389/tcp -p 3389:3389/udp --name win-dockur dockurr/windows
        echo "Dang khoi dong Dockur Windows... Vui long cho trong giay lat."

    - name: 2. Tao tai khoan Admin cho may ao GitHub
      run: |
        net user administrator MatKhauMoi123 /active:yes
        net localgroup administrators administrator /add
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    - name: 3. Tai va Khoi dong Ngrok RDP Tunnel
      run: |
        # SỬ DỤNG LINK TẢI TRỰC TIẾP CHÍNH THỨC CỦA NGROK WINDOWS
        Invoke-WebRequest -Uri "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip" -OutFile "ngrok.zip"
        Expand-Archive -Path "ngrok.zip" -DestinationPath "."
        
        # Cấu hình Token ngrok của bạn
        .\ngrok.exe config add-authtoken 3LayGRTf8kCMeaebdTBnUqjSv7f_5WcXXpsBqX5B1pe6oEVqV
        
        # Bật đường truyền kết nối cổng RDP ra ngoài internet
        .\ngrok.exe tcp 3389
