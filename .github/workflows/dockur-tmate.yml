name: Dockur Windows qua Tmate RDP

on: 
  workflow_dispatch # Bấm nút chạy thủ công

jobs:
  run-vm:
    runs-on: ubuntu-latest # Chạy trên nền Linux Ubuntu ổn định
    steps:
    - name: 1. Tai va Chay Dockur Windows ngam
      run: |
        docker run -d -p 3389:3389/tcp -p 3389:3389/udp --privileged -e KVM="N" --name win-dockur dockurr/windows
        echo "Dang khoi dong Dockur Windows... Vui long cho trong giay lat."

    - name: 2. Mo duong truyen RDP bang Tmate
      uses: mxschmitt/action-tmate@v3
