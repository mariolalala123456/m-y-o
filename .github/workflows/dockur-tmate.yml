name: Mo Windows Dockur bang Ngrok Web

on: 
  workflow_dispatch # Bấm nút chạy thủ công

jobs:
  run-vm:
    runs-on: ubuntu-latest # Chạy trên nền Linux Ubuntu ổn định
    steps:
    - name: 1. Tai va Chay Dockur Windows ngam
      run: |
        docker run -d -p 8006:8006 --privileged -e KVM="N" --name win-dockur dockurr/windows
        echo "Dang khoi dong Dockur Windows..."

    - name: 2. Tai Ngrok va Bat duong truyen giao dien Web
      run: |
        # Tải file thực thi trực tiếp từ trang chủ Ngrok dành cho Linux
        curl -fsSL https://ngrok.com | tar -xz
        
        # Cấu hình mã Token ngrok miễn phí của bạn
        ./ngrok config add-authtoken 3LayGRTf8kCMeaebdTBnUqjSv7f_5WcXXpsBqX5B1pe6oEVqV
        
        # Bật đường truyền cổng 8006 (Giao diện Web) ra ngoài Internet (Không bị chặn thẻ)
        ./ngrok http 8006
